<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Students - School Management</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/layout.css">
</head>

<body>

<header class="dashboard-header">
    <div>
        <h1>🎓 <span id="schoolName">My School</span></h1>
        <p>Student Management</p>
    </div>
</header>

<nav class="main-nav">
    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/students.html" class="active">👨‍🎓 Students</a>
    <a href="/teachers.html">👨‍🏫 Teachers</a>
    <a href="/attendance.html">📅 Attendance</a>
    <a href="/attendance-report.html">📊 Reports</a>
    <a href="/classes.html">🏫 Classes</a>
    <a href="/fees.html">💰 Fees</a>
    <a href="/logout">🚪 Logout</a>
</nav>

<main>

    <div class="page-header">
        <div>
            <h2>👨‍🎓 Students</h2>
            <p>Manage students of your school.</p>
        </div>
    </div>

    <section class="form-card">

        <h3 id="formTitle">➕ Add Student</h3>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Student name" required>
            </div>

            <div class="form-group">
                <label for="father">Father Name</label>
                <input type="text" id="father" placeholder="Father name" required>
            </div>

            <div class="form-group">
                <label for="classname">Class</label>
                <input type="text" id="classname" placeholder="e.g. Class 5" required>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" placeholder="Roll number" required>
            </div>

            <button type="submit" class="btn-primary">
                💾 Save Student
            </button>

            <button type="button" id="cancelBtn" class="btn-secondary" style="display:none;">
                Cancel
            </button>

            <p id="message"></p>

        </form>

    </section>


    <section class="table-card">

        <div class="table-header">
            <h3>📋 Student List</h3>
        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Father</th>
                        <th>Class</th>
                        <th>Roll</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentsTable">
                    <tr>
                        <td colspan="6">Loading...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

let students = [];

// Prevents student names from being interpreted as HTML
function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

async function loadStudents() {

    try {

        const response =
            await fetch("/api/students", {
                credentials: "include"
            });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return;
        }

        if (!response.ok) {
            throw new Error("Failed to load students");
        }

        students = await response.json();

        renderStudents();

    } catch (error) {

        console.error(error);

        document.getElementById("studentsTable").innerHTML = `
            <tr>
                <td colspan="6">Unable to load students.</td>
            </tr>
        `;
    }
}


function renderStudents() {

    const table =
        document.getElementById("studentsTable");

    if (!students.length) {

        table.innerHTML = `
            <tr>
                <td colspan="6">No students found.</td>
            </tr>
        `;

        return;
    }

    table.innerHTML =
        students.map(student => `

            <tr>

                <td data-label="ID">${esc(student.id)}</td>

                <td data-label="Name">${esc(student.name)}</td>

                <td data-label="Father">${esc(student.father)}</td>

                <td data-label="Class">${esc(student.classname)}</td>

                <td data-label="Roll">${esc(student.roll)}</td>

                <td data-label="Actions">

                    <span>
                        <button
                            onclick="editStudent(${Number(student.id)})"
                            class="btn-small"
                        >
                            ✏️
                        </button>

                        <button
                            onclick="deleteStudent(${Number(student.id)})"
                            class="btn-small btn-danger"
                        >
                            🗑️
                        </button>
                    </span>

                </td>

            </tr>

        `).join("");
}


document
    .getElementById("studentForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const id =
            document.getElementById("studentId").value;

        const student = {

            name:
                document.getElementById("name").value.trim(),

            father:
                document.getElementById("father").value.trim(),

            classname:
                document.getElementById("classname").value.trim(),

            roll:
                document.getElementById("roll").value.trim()

        };

        try {

            const url =
                id
                    ? `/api/students/${id}`
                    : "/api/students";

            const method =
                id ? "PUT" : "POST";

            const response =
                await fetch(url, {

                    method,

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify(student)

                });

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Unable to save student"
                );
            }

            document.getElementById("message").textContent =
                id
                    ? "Student updated successfully."
                    : "Student added successfully.";

            resetForm();

            loadStudents();

        } catch (error) {

            document.getElementById("message").textContent =
                error.message;

        }

    });


function editStudent(id) {

    const student =
        students.find(s => s.id == id);

    if (!student) return;

    document.getElementById("studentId").value = student.id;

    document.getElementById("name").value = student.name || "";

    document.getElementById("father").value = student.father || "";

    document.getElementById("classname").value = student.classname || "";

    document.getElementById("roll").value = student.roll || "";

    document.getElementById("formTitle").textContent =
        "✏️ Edit Student";

    document.getElementById("cancelBtn").style.display =
        "inline-block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


async function deleteStudent(id) {

    if (!confirm(
        "Are you sure you want to delete this student?"
    )) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/students/${id}`,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to delete student"
            );
        }

        loadStudents();

    } catch (error) {

        alert(error.message);

    }
}


function resetForm() {

    document.getElementById("studentForm").reset();

    document.getElementById("studentId").value = "";

    document.getElementById("formTitle").textContent =
        "➕ Add Student";

    document.getElementById("cancelBtn").style.display =
        "none";
}


document
    .getElementById("cancelBtn")
    .addEventListener("click", resetForm);


loadStudents();

</script>

<script src="/layout.js"></script>

</body>
</html>
