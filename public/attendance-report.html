<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Attendance Report - My School</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .report-tools {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .report-tools label {
            display: block;
            font-weight: bold;
            margin: 8px 0;
        }

        .report-tools input,
        .report-tools select {
            width: 100%;
            box-sizing: border-box;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            padding: 18px 10px;
            text-align: center;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .summary-card h3 {
            margin: 0;
            font-size: 13px;
        }

        .summary-card p {
            margin: 7px 0 0;
            font-size: 26px;
            font-weight: bold;
        }

        .report-card {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .report-card h3 {
            margin: 0 0 7px;
        }

        .report-card p {
            margin: 5px 0;
            color: var(--muted);
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 5px;
        }

        .present {
            background: #dcfce7;
            color: #166534;
        }

        .absent {
            background: #fee2e2;
            color: #991b1b;
        }

        .not-marked {
            background: #fef3c7;
            color: #92400e;
        }

        .percentage {
            font-size: 20px;
            font-weight: bold;
        }

        .empty-message {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: var(--muted);
        }

        .report-count {
            color: var(--muted);
            margin-bottom: 15px;
        }

        @media (max-width: 850px) {

            .summary {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 600px) {

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .summary {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .summary-card {
                padding: 14px 6px;
            }

            .summary-card p {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<header class="dashboard-header">

    <h1>🎓 My School</h1>

    <p>
        Attendance History & Report
    </p>

</header>


<nav class="main-nav">

    <a href="/dashboard.html">
        🏠 Dashboard
    </a>

    <a href="/students.html">
        👨‍🎓 Students
    </a>

    <a href="/teachers.html">
        👨‍🏫 Teachers
    </a>

    <a href="/attendance.html">
        📅 Attendance
    </a>

    <a href="/attendance-report.html" class="active">
        📊 Reports
    </a>

    <a href="/classes.html">
        🏫 Classes
    </a>

    <a href="/fees.html">
        💰 Fees
    </a>
    <a id="navLogout" href="/logout">🚪 Logout</a>
</nav>


<main>


    <div class="page-header">

        <div>

            <h2>
                📊 Attendance Report
            </h2>

            <p style="color:var(--muted);">
                View attendance for any date
            </p>

        </div>

        <strong id="reportDateLabel">
            Today
        </strong>

    </div>


    <!-- FILTERS -->

    <div class="report-tools">

        <label for="reportDate">
            📅 Select Date
        </label>

        <input
            type="date"
            id="reportDate">


        <label for="searchStudent">
            🔍 Search Student
        </label>

        <input
            type="search"
            id="searchStudent"
            placeholder="Search by name or roll number...">


        <label for="classFilter">
            🏫 Filter Class
        </label>

        <select id="classFilter">

            <option value="all">
                All Classes
            </option>

        </select>

    </div>


    <!-- SUMMARY -->

    <div id="summary"></div>


    <div
        id="reportCount"
        class="report-count">
    </div>


    <!-- REPORT -->

    <div id="report">

        <div class="empty-message">
            Loading report...
        </div>

    </div>


    <br>


</main>


<script>

let students = [];

let attendance = [];


const reportDate =
    document.getElementById(
        "reportDate"
    );

const searchStudent =
    document.getElementById(
        "searchStudent"
    );

const classFilter =
    document.getElementById(
        "classFilter"
    );

const report =
    document.getElementById(
        "report"
    );

const summary =
    document.getElementById(
        "summary"
    );


/* =========================
   TODAY
========================= */

const today =
    new Date()
        .toISOString()
        .split("T")[0];

reportDate.value = today;


/* =========================
   LOAD DATA
========================= */

async function loadReport() {

    const date =
        reportDate.value;


    if (!date) {

        alert(
            "Please select a date."
        );

        return;

    }


    report.innerHTML = `
        <div class="empty-message">
            Loading report...
        </div>
    `;


    try {

        const studentsResponse =
            await fetch(
                "/api/students"
            );


        if (!studentsResponse.ok) {

            throw new Error(
                "Students API failed"
            );

        }


        students =
            await studentsResponse.json();


        const attendanceResponse =
            await fetch(
                "/api/attendance?date=" +
                encodeURIComponent(date)
            );


        if (!attendanceResponse.ok) {

            throw new Error(
                "Attendance API failed"
            );

        }


        attendance =
            await attendanceResponse.json();


        createClassFilter();

        updateDateLabel();

        renderReport();

    }

    catch (error) {

        console.log(
            "Report error:",
            error
        );


        summary.innerHTML = "";


        report.innerHTML = `
            <div class="empty-message">
                ❌ Could not load attendance report.
            </div>
        `;

    }

}


/* =========================
   CLASS FILTER
========================= */

function createClassFilter() {

    const currentValue =
        classFilter.value;


    const classes = [
        ...new Set(
            students
                .map(
                    student =>
                        student.className
                )
                .filter(Boolean)
        )
    ];


    classFilter.innerHTML = `
        <option value="all">
            All Classes
        </option>
    `;


    classes.sort().forEach(
        className => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                className;

            option.textContent =
                className;

            classFilter.appendChild(
                option
            );

        }
    );


    if (
        classes.includes(
            currentValue
        )
    ) {

        classFilter.value =
            currentValue;

    }

}


/* =========================
   RENDER REPORT
========================= */

function renderReport() {

    const search =
        searchStudent.value
            .toLowerCase()
            .trim();


    const selectedClass =
        classFilter.value;


    const filtered =
        students.filter(
            student => {

                const name =
                    String(
                        student.name || ""
                    )
                    .toLowerCase();


                const roll =
                    String(
                        student.roll || ""
                    )
                    .toLowerCase();


                const matchesSearch =
                    name.includes(search) ||
                    roll.includes(search);


                const matchesClass =
                    selectedClass === "all" ||
                    student.className ===
                        selectedClass;


                return (
                    matchesSearch &&
                    matchesClass
                );

            }
        );


    let present = 0;
    let absent = 0;
    let notMarked = 0;


    /*
     * Summary should represent
     * the selected class/search results.
     */

    filtered.forEach(
        student => {

            const record =
                attendance.find(
                    item =>
                        item.studentId ==
                        student.id
                );


            const status =
                record
                    ? record.status
                    : "Not Marked";


            if (
                status === "Present"
            ) {
                present++;
            }

            else if (
                status === "Absent"
            ) {
                absent++;
            }

            else {
                notMarked++;
            }

        }
    );


    const total =
        filtered.length;


    const marked =
        present + absent;


    let percentage = 0;


    if (marked > 0) {

        percentage =
            Math.round(
                (present / marked) * 100
            );

    }


    /* SUMMARY */

    summary.innerHTML = `

        <div class="summary">

            <div class="summary-card">

                <h3>
                    👨‍🎓 Total
                </h3>

                <p>
                    ${total}
                </p>

            </div>


            <div class="summary-card">

                <h3>
                    ✅ Present
                </h3>

                <p>
                    ${present}
                </p>

            </div>


            <div class="summary-card">

                <h3>
                    ❌ Absent
                </h3>

                <p>
                    ${absent}
                </p>

            </div>


            <div class="summary-card">

                <h3>
                    ⏳ Not Marked
                </h3>

                <p>
                    ${notMarked}
                </p>

            </div>


            <div class="summary-card">

                <h3>
                    📈 Attendance
                </h3>

                <p class="percentage">
                    ${percentage}%
                </p>

            </div>

        </div>

    `;


    document.getElementById(
        "reportCount"
    ).textContent =
        "Showing " +
        total +
        " student" +
        (total === 1 ? "" : "s");


    /* REPORT LIST */

    report.innerHTML = "";


    if (!filtered.length) {

        report.innerHTML = `
            <div class="empty-message">
                🔍 No students found.
            </div>
        `;

        return;

    }


    filtered.forEach(
        student => {

            const record =
                attendance.find(
                    item =>
                        item.studentId ==
                        student.id
                );


            const status =
                record
                    ? record.status
                    : "Not Marked";


            let statusClass =
                "not-marked";


            if (
                status === "Present"
            ) {

                statusClass =
                    "present";

            }


            if (
                status === "Absent"
            ) {

                statusClass =
                    "absent";

            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "report-card";


            div.innerHTML = `

                <h3>
                    👨‍🎓
                    ${escapeHTML(
                        student.name
                    )}
                </h3>

                <p>
                    🏫 Class:
                    ${escapeHTML(
                        student.className
                    )}
                </p>

                <p>
                    🔢 Roll No:
                    ${escapeHTML(
                        student.roll
                    )}
                </p>

                <p>

                    Status:

                    <span
                        class="status ${statusClass}">

                        ${status}

                    </span>

                </p>

            `;


            report.appendChild(
                div
            );

        }
    );

}


/* =========================
   DATE LABEL
========================= */

function updateDateLabel() {

    const date =
        reportDate.value;


    if (!date) return;


    const selected =
        new Date(
            date + "T00:00:00"
        );


    document.getElementById(
        "reportDateLabel"
    ).textContent =
        selected.toLocaleDateString(
            "en-US",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

}


/* =========================
   EVENTS
========================= */

reportDate.addEventListener(
    "change",
    loadReport
);


searchStudent.addEventListener(
    "input",
    renderReport
);


classFilter.addEventListener(
    "change",
    renderReport
);


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   START
========================= */

loadReport();

</script>

<script src="/script.js?v=3"></script>
</body>
</html>
