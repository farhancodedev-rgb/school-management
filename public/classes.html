<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Classes - My School</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .class-form {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .class-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .class-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .class-icon {
            font-size: 38px;
        }

        .student-count {
            font-size: 25px;
            font-weight: bold;
            margin: 10px 0;
        }

        .class-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .edit-btn {
            background: #2563eb;
        }

        .delete-btn {
            background: #dc2626;
        }

        .empty-message {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        @media (max-width: 750px) {

            .class-list {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .class-list {
                grid-template-columns: 1fr;
            }

            .class-actions {
                flex-direction: column;
            }

            .class-actions button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header class="dashboard-header">

    <h1>🎓 My School</h1>

    <p>
        Classes & Sections
    </p>

</header>


<nav class="main-nav">

    <a href="/">
        🏠 Dashboard
    </a>

    <a href="/students.html">
        👨‍🎓 Students
    </a>

    <a href="/teachers.html">
        👨‍🏫 Teachers
    </a>

    <a href="/attendance.html">
        📅 Attendance
    </a>

    <a href="/attendance-report.html">
        📊 Reports
    </a>

    <a href="/classes.html">
        🏫 Classes
    </a>

    <a href="/fees.html">
        💰 Fees
    </a>
    <a id="navLogout" href="/logout">🚪 Logout</a>
</nav>


<main>


    <h2>
        🏫 Class Management
    </h2>


    <!-- ADD CLASS -->

    <div class="class-form">

        <h3>
            ➕ Add New Class
        </h3>


        <form id="classForm">

            <input
                type="text"
                id="className"
                placeholder="Class Name e.g. Class 1"
                required>


            <input
                type="text"
                id="section"
                placeholder="Section e.g. A"
                required>


            <button
                type="submit">

                ➕ Add Class

            </button>

        </form>

    </div>


    <h2>
        📚 Class List
    </h2>


    <div
        id="classList"
        class="class-list">

        <div class="empty-message">
            Loading classes...
        </div>

    </div>


    <br>


</main>


<script>

const form =
    document.getElementById(
        "classForm"
    );

const classList =
    document.getElementById(
        "classList"
    );


let classes = [];

let students = [];


/* =========================
   LOAD DATA
========================= */

async function loadData() {

    classList.innerHTML = `
        <div class="empty-message">
            Loading...
        </div>
    `;


    try {

        const [
            classesResponse,
            studentsResponse
        ] = await Promise.all([

            fetch("/api/classes"),

            fetch("/api/students")

        ]);


        if (
            !classesResponse.ok ||
            !studentsResponse.ok
        ) {

            throw new Error(
                "API request failed"
            );

        }


        classes =
            await classesResponse.json();


        students =
            await studentsResponse.json();


        renderClasses();

    }

    catch (error) {

        console.log(
            "Classes error:",
            error
        );


        classList.innerHTML = `
            <div class="empty-message">
                ❌ Could not load classes.
            </div>
        `;

    }

}


/* =========================
   RENDER CLASSES
========================= */

function renderClasses() {

    classList.innerHTML = "";


    if (classes.length === 0) {

        classList.innerHTML = `
            <div class="empty-message">

                🏫 No classes found.

                <br><br>

                Add your first class above.

            </div>
        `;

        return;

    }


    classes.forEach(item => {


        /*
         * Count students whose
         * className matches.
         */

        const studentCount =
            students.filter(
                student =>
                    student.className ===
                    item.className
            ).length;


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "class-card";


        div.innerHTML = `

            <div class="class-icon">
                🏫
            </div>


            <h3>
                ${escapeHTML(
                    item.className
                )}
            </h3>


            <p>
                Section:
                <strong>
                    ${escapeHTML(
                        item.section
                    )}
                </strong>
            </p>


            <div class="student-count">
                ${studentCount}
            </div>


            <p>
                👨‍🎓 Students
            </p>


            <div class="class-actions">

                <button
                    class="edit-btn"
                    onclick="editClass(
                        ${item.id},
                        '${escapeJS(
                            item.className
                        )}',
                        '${escapeJS(
                            item.section
                        )}'
                    )">

                    ✏️ Edit

                </button>


                <button
                    class="delete-btn"
                    onclick="deleteClass(
                        ${item.id}
                    )">

                    🗑️ Delete

                </button>

            </div>

        `;


        classList.appendChild(
            div
        );

    });

}


/* =========================
   ADD CLASS
========================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const className =
            document.getElementById(
                "className"
            ).value.trim();


        const section =
            document.getElementById(
                "section"
            ).value.trim();


        if (
            !className ||
            !section
        ) {

            alert(
                "Please fill all fields."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    "/api/classes",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                className:
                                    className,

                                section:
                                    section

                            })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Could not add class"
                );

            }


            alert(
                "Class added successfully! ✅"
            );


            form.reset();


            loadData();

        }

        catch (error) {

            console.log(
                error
            );


            alert(
                "Could not add class ❌"
            );

        }

    }
);


/* =========================
   EDIT CLASS
========================= */

async function editClass(
    id,
    oldClassName,
    oldSection
) {

    const className =
        prompt(
            "Class Name:",
            oldClassName
        );


    if (
        className === null
    ) {
        return;
    }


    const section =
        prompt(
            "Section:",
            oldSection
        );


    if (
        section === null
    ) {
        return;
    }


    if (
        !className.trim() ||
        !section.trim()
    ) {

        alert(
            "Fields cannot be empty."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/classes/" + id,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            className:
                                className.trim(),

                            section:
                                section.trim()

                        })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Update failed"
            );

        }


        alert(
            "Class updated successfully! ✅"
        );


        loadData();

    }

    catch (error) {

        console.log(
            error
        );


        alert(
            "Could not update class ❌"
        );

    }

}


/* =========================
   DELETE CLASS
========================= */

async function deleteClass(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this class?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/classes/" + id,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );

        }


        alert(
            "Class deleted successfully! 🗑️"
        );


        loadData();

    }

    catch (error) {

        console.log(
            error
        );


        alert(
            "Could not delete class ❌"
        );

    }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJS(value) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* =========================
   START
========================= */

loadData();

</script>


<script src="/script.js?v=3"></script>
</body>
</html>
