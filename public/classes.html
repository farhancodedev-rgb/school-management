<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Classes - School Management</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/layout.css">
</head>

<body>

<header class="dashboard-header">
    <div>
        <h1>🎓 <span id="schoolName">My School</span></h1>
        <p>Class Management</p>
    </div>
</header>

<nav class="main-nav">
    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/students.html">👨‍🎓 Students</a>
    <a href="/teachers.html">👨‍🏫 Teachers</a>
    <a href="/attendance.html">📅 Attendance</a>
    <a href="/attendance-report.html">📊 Reports</a>
    <a href="/classes.html" class="active">🏫 Classes</a>
    <a href="/fees.html">💰 Fees</a>
    <a href="/logout">🚪 Logout</a>
</nav>

<main>

    <div class="page-header">
        <div>
            <h2>🏫 Classes</h2>
            <p>Manage classes of your school.</p>
        </div>
    </div>

    <!-- Class Form -->
    <section class="form-card">

        <h3 id="formTitle">➕ Add Class</h3>

        <form id="classForm">

            <input type="hidden" id="classId">

            <div class="form-group">
                <label for="classname">Class Name</label>
                <input type="text" id="classname" placeholder="e.g. Class 5" required>
            </div>

            <div class="form-group">
                <label for="section">Section</label>
                <input type="text" id="section" placeholder="e.g. A" required>
            </div>

            <button type="submit" class="btn-primary">
                💾 Save Class
            </button>

            <button type="button" id="cancelBtn" class="btn-secondary" style="display:none;">
                Cancel
            </button>

            <p id="message"></p>

        </form>

    </section>

    <!-- Class List -->
    <section class="table-card">

        <div class="table-header">
            <h3>📋 Class List</h3>
        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Class</th>
                        <th>Section</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="classesTable">
                    <tr>
                        <td colspan="4">Loading...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

let classes = [];

// Prevents class data from being interpreted as HTML
function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

async function loadClasses() {

    try {

        const response =
            await fetch("/api/classes", {
                credentials: "include"
            });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return;
        }

        if (!response.ok) {
            throw new Error("Failed to load classes");
        }

        classes = await response.json();

        renderClasses();

    } catch (error) {

        console.error(error);

        document.getElementById("classesTable").innerHTML = `
            <tr>
                <td colspan="4">Unable to load classes.</td>
            </tr>
        `;
    }
}


function renderClasses() {

    const table =
        document.getElementById("classesTable");

    if (!classes.length) {

        table.innerHTML = `
            <tr>
                <td colspan="4">No classes found.</td>
            </tr>
        `;

        return;
    }

    table.innerHTML =
        classes.map(item => `

            <tr>

                <td data-label="ID">${esc(item.id)}</td>

                <td data-label="Class">${esc(item.classname)}</td>

                <td data-label="Section">${esc(item.section)}</td>

                <td data-label="Actions">

                    <span>
                        <button
                            onclick="editClass(${Number(item.id)})"
                            class="btn-small"
                        >
                            ✏️
                        </button>

                        <button
                            onclick="deleteClass(${Number(item.id)})"
                            class="btn-small btn-danger"
                        >
                            🗑️
                        </button>
                    </span>

                </td>

            </tr>

        `).join("");
}


document
    .getElementById("classForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const id =
            document.getElementById("classId").value;

        const classData = {

            classname:
                document.getElementById("classname").value.trim(),

            section:
                document.getElementById("section").value.trim()

        };

        try {

            const url =
                id
                    ? `/api/classes/${id}`
                    : "/api/classes";

            const method =
                id ? "PUT" : "POST";

            const response =
                await fetch(url, {

                    method,

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify(classData)

                });

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Unable to save class"
                );
            }

            document.getElementById("message").textContent =
                id
                    ? "Class updated successfully."
                    : "Class added successfully.";

            resetForm();

            loadClasses();

        } catch (error) {

            document.getElementById("message").textContent =
                error.message;

        }

    });


function editClass(id) {

    const item =
        classes.find(c => c.id == id);

    if (!item) return;

    document.getElementById("classId").value = item.id;

    document.getElementById("classname").value = item.classname || "";

    document.getElementById("section").value = item.section || "";

    document.getElementById("formTitle").textContent =
        "✏️ Edit Class";

    document.getElementById("cancelBtn").style.display =
        "inline-block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


async function deleteClass(id) {

    if (!confirm(
        "Are you sure you want to delete this class?"
    )) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/classes/${id}`,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to delete class"
            );
        }

        loadClasses();

    } catch (error) {

        alert(error.message);

    }
}


function resetForm() {

    document.getElementById("classForm").reset();

    document.getElementById("classId").value = "";

    document.getElementById("formTitle").textContent =
        "➕ Add Class";

    document.getElementById("cancelBtn").style.display =
        "none";
}


document
    .getElementById("cancelBtn")
    .addEventListener("click", resetForm);


loadClasses();

</script>

<script src="/layout.js"></script>

</body>
</html>
