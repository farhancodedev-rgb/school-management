<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classes - My School</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🎓 My School</h1>
    <p>Classes & Sections</p>
</header>

<main>

    <h2>🏫 Add Class</h2>

    <form id="classForm">

        <input
            type="text"
            id="className"
            placeholder="Class Name e.g. Class 1"
            required
        >

        <input
            type="text"
            id="section"
            placeholder="Section e.g. A"
            required
        >

        <button type="submit">
            ➕ Add Class
        </button>

    </form>

    <h2>Class List</h2>

    <div id="classList"></div>

    <br>

    <a href="/">⬅ Back to Dashboard</a>

</main>

<script>

const form =
    document.getElementById("classForm");

const classList =
    document.getElementById("classList");


// Load classes

async function loadClasses() {

    const response =
        await fetch("/api/classes");

    const classes =
        await response.json();

    classList.innerHTML = "";

    classes.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "card";

        div.innerHTML = `

            <h3>🏫 ${item.className}</h3>

            <p>
                Section: ${item.section}
            </p>

            <button
                onclick="deleteClass(${item.id})">
                🗑️ Delete
            </button>
        `;

        classList.appendChild(div);
    });
}


// Add class

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const classData = {

            className:
                document.getElementById(
                    "className"
                ).value,

            section:
                document.getElementById(
                    "section"
                ).value
        };

        const response =
            await fetch("/api/classes", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(classData)
            });

        if (response.ok) {

            alert(
                "Class added successfully! ✅"
            );

            form.reset();

            loadClasses();

        } else {

            alert(
                "Something went wrong ❌"
            );
        }
    }
);


// Delete class

async function deleteClass(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this class?"
        );

    if (!confirmDelete) {
        return;
    }

    await fetch(
        "/api/classes/" + id,
        {
            method: "DELETE"
        }
    );

    alert("Class deleted! 🗑️");

    loadClasses();
}


loadClasses();

</script>

</body>
</html>
