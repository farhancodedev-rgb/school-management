<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Teachers - My School</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .search-box input {
            margin: 0;
        }

        #teacherList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .teacher-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .teacher-card h3 {
            margin-top: 0;
        }

        .teacher-info {
            color: var(--muted);
            line-height: 1.8;
        }

        .teacher-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .teacher-actions button {
            flex: 1;
        }

        .edit-btn {
            background: #2563eb;
        }

        .delete-btn {
            background: #dc2626;
        }

        .empty-message {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: var(--muted);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .modal-box h2 {
            margin-top: 0;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        .modal-actions button {
            flex: 1;
        }

        .cancel-btn {
            background: #64748b;
        }

        @media (max-width: 650px) {

            #teacherList {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .teacher-actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<header class="dashboard-header">

    <div>

        <h1>🎓 My School</h1>

        <p>
            Teacher Management
        </p>

    </div>

    <a
        href="/"
        style="color:white;text-decoration:none;font-weight:bold;">
        🏠 Dashboard
    </a>

</header>


<nav class="main-nav">

    <a href="/">
        🏠 Dashboard
    </a>

    <a href="/students.html">
        👨‍🎓 Students
    </a>

    <a href="/teachers.html" class="active">
        👨‍🏫 Teachers
    </a>

    <a href="/attendance.html">
        📅 Attendance
    </a>

    <a href="/attendance-report.html">
        📊 Reports
    </a>

    <a href="/classes.html">
        🏫 Classes
    </a>

</nav>


<main>

    <div class="page-header">

        <div>

            <h2>
                👨‍🏫 Teachers
            </h2>

            <p style="color:var(--muted);">
                Add and manage school teachers
            </p>

        </div>

        <strong id="teacherTotal">
            0 Teachers
        </strong>

    </div>


    <!-- ADD TEACHER -->

    <form id="teacherForm">

        <h3>
            ➕ Add New Teacher
        </h3>

        <input
            type="text"
            id="name"
            placeholder="Teacher Name"
            required>

        <input
            type="text"
            id="father"
            placeholder="Father Name"
            required>

        <input
            type="text"
            id="subject"
            placeholder="Subject"
            required>

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required>

        <button type="submit">
            ➕ Add Teacher
        </button>

    </form>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="search"
            id="searchTeacher"
            placeholder="🔍 Search teacher, subject or phone...">

    </div>


    <!-- TEACHER LIST -->

    <div id="teacherList">

        <p>
            Loading teachers...
        </p>

    </div>

</main>


<!-- EDIT MODAL -->

<div
    id="editModal"
    class="modal">

    <div class="modal-box">

        <h2>
            ✏️ Edit Teacher
        </h2>

        <input
            type="text"
            id="editName"
            placeholder="Teacher Name">

        <input
            type="text"
            id="editFather"
            placeholder="Father Name">

        <input
            type="text"
            id="editSubject"
            placeholder="Subject">

        <input
            type="text"
            id="editPhone"
            placeholder="Phone Number">

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeEditModal()">
                Cancel
            </button>

            <button
                onclick="saveEdit()">
                💾 Save Changes
            </button>

        </div>

    </div>

</div>


<script>

let teachers = [];

let editingTeacherId = null;


/* =========================
   LOAD TEACHERS
========================= */

async function loadTeachers() {

    try {

        const response =
            await fetch("/api/teachers");

        teachers =
            await response.json();

        renderTeachers();

    }

    catch (error) {

        console.log(
            "Teacher loading error:",
            error
        );

        document.getElementById(
            "teacherList"
        ).innerHTML =
            "<div class='empty-message'>❌ Could not load teachers.</div>";

    }

}


/* =========================
   RENDER
========================= */

function renderTeachers() {

    const list =
        document.getElementById(
            "teacherList"
        );

    const search =
        document.getElementById(
            "searchTeacher"
        ).value
        .toLowerCase()
        .trim();


    const filtered =
        teachers.filter(teacher => {

            return (

                String(teacher.name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(teacher.father || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(teacher.subject || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(teacher.phone || "")
                    .toLowerCase()
                    .includes(search)

            );

        });


    document.getElementById(
        "teacherTotal"
    ).textContent =
        teachers.length +
        (teachers.length === 1
            ? " Teacher"
            : " Teachers");


    if (!filtered.length) {

        list.innerHTML = `
            <div class="empty-message">
                🔍 No teachers found.
            </div>
        `;

        return;

    }


    list.innerHTML =
        filtered.map(teacher => `

            <div class="teacher-card">

                <h3>
                    👨‍🏫 ${escapeHTML(teacher.name)}
                </h3>

                <div class="teacher-info">

                    <div>
                        👨‍👦 Father:
                        ${escapeHTML(teacher.father)}
                    </div>

                    <div>
                        📚 Subject:
                        ${escapeHTML(teacher.subject)}
                    </div>

                    <div>
                        📱 Phone:
                        ${escapeHTML(teacher.phone)}
                    </div>

                </div>


                <div class="teacher-actions">

                    <button
                        class="edit-btn"
                        onclick="openEditModal(${teacher.id})">

                        ✏️ Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteTeacher(${teacher.id})">

                        🗑️ Delete

                    </button>

                </div>

            </div>

        `).join("");

}


/* =========================
   ADD TEACHER
========================= */

document.getElementById(
    "teacherForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const teacher = {

            name:
                document.getElementById(
                    "name"
                ).value.trim(),

            father:
                document.getElementById(
                    "father"
                ).value.trim(),

            subject:
                document.getElementById(
                    "subject"
                ).value.trim(),

            phone:
                document.getElementById(
                    "phone"
                ).value.trim()

        };


        try {

            const response =
                await fetch(
                    "/api/teachers",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                teacher
                            )

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to add teacher"
                );

            }


            this.reset();

            await loadTeachers();


            alert(
                "Teacher added successfully! ✅"
            );

        }

        catch (error) {

            console.log(error);

            alert(
                "Could not add teacher ❌"
            );

        }

    }
);


/* =========================
   SEARCH
========================= */

document.getElementById(
    "searchTeacher"
).addEventListener(
    "input",
    renderTeachers
);


/* =========================
   EDIT MODAL
========================= */

function openEditModal(id) {

    const teacher =
        teachers.find(
            item => item.id == id
        );

    if (!teacher) return;


    editingTeacherId = id;


    document.getElementById(
        "editName"
    ).value =
        teacher.name || "";


    document.getElementById(
        "editFather"
    ).value =
        teacher.father || "";


    document.getElementById(
        "editSubject"
    ).value =
        teacher.subject || "";


    document.getElementById(
        "editPhone"
    ).value =
        teacher.phone || "";


    document.getElementById(
        "editModal"
    ).style.display =
        "flex";

}


function closeEditModal() {

    editingTeacherId = null;

    document.getElementById(
        "editModal"
    ).style.display =
        "none";

}


/* =========================
   SAVE EDIT
========================= */

async function saveEdit() {

    if (!editingTeacherId) return;


    const teacher = {

        name:
            document.getElementById(
                "editName"
            ).value.trim(),

        father:
            document.getElementById(
                "editFather"
            ).value.trim(),

        subject:
            document.getElementById(
                "editSubject"
            ).value.trim(),

        phone:
            document.getElementById(
                "editPhone"
            ).value.trim()

    };


    try {

        const response =
            await fetch(
                "/api/teachers/" +
                editingTeacherId,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            teacher
                        )

                }
            );


        if (!response.ok) {

            throw new Error(
                "Update failed"
            );

        }


        closeEditModal();

        await loadTeachers();


        alert(
            "Teacher updated successfully! ✅"
        );

    }

    catch (error) {

        console.log(error);

        alert(
            "Could not update teacher ❌"
        );

    }

}


/* =========================
   DELETE
========================= */

async function deleteTeacher(id) {

    if (
        !confirm(
            "Delete this teacher?"
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/teachers/" + id,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );

        }


        await loadTeachers();


        alert(
            "Teacher deleted successfully! 🗑️"
        );

    }

    catch (error) {

        console.log(error);

        alert(
            "Could not delete teacher ❌"
        );

    }

}


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   INITIAL LOAD
========================= */

loadTeachers();

</script>

</body>
</html>
