<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Teachers - School Management</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/layout.css">
</head>

<body>

<header class="dashboard-header">
    <div>
        <h1>🎓 <span id="schoolName">My School</span></h1>
        <p>Teacher Management</p>
    </div>
</header>

<nav class="main-nav">
    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/students.html">👨‍🎓 Students</a>
    <a href="/teachers.html" class="active">👨‍🏫 Teachers</a>
    <a href="/attendance.html">📅 Attendance</a>
    <a href="/attendance-report.html">📊 Reports</a>
    <a href="/classes.html">🏫 Classes</a>
    <a href="/fees.html">💰 Fees</a>
    <a href="/logout">🚪 Logout</a>
</nav>

<main>

    <div class="page-header">
        <div>
            <h2>👨‍🏫 Teachers</h2>
            <p>Manage teachers of your school.</p>
        </div>
    </div>

    <!-- Teacher Form -->
    <section class="form-card">

        <h3 id="formTitle">➕ Add Teacher</h3>

        <form id="teacherForm">

            <input type="hidden" id="teacherId">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Teacher name" required>
            </div>

            <div class="form-group">
                <label for="father">Father Name</label>
                <input type="text" id="father" placeholder="Father name" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="e.g. Mathematics" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="Phone number">
            </div>

            <button type="submit" class="btn-primary">
                💾 Save Teacher
            </button>

            <button type="button" id="cancelBtn" class="btn-secondary" style="display:none;">
                Cancel
            </button>

            <p id="message"></p>

        </form>

    </section>

    <!-- Teacher List -->
    <section class="table-card">

        <div class="table-header">
            <h3>📋 Teacher List</h3>
        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Father</th>
                        <th>Subject</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="teachersTable">
                    <tr>
                        <td colspan="6">Loading...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

let teachers = [];

// Prevents teacher data from being interpreted as HTML
function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

async function loadTeachers() {

    try {

        const response =
            await fetch("/api/teachers", {
                credentials: "include"
            });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return;
        }

        if (!response.ok) {
            throw new Error("Failed to load teachers");
        }

        teachers = await response.json();

        renderTeachers();

    } catch (error) {

        console.error(error);

        document.getElementById("teachersTable").innerHTML = `
            <tr>
                <td colspan="6">Unable to load teachers.</td>
            </tr>
        `;
    }
}


function renderTeachers() {

    const table =
        document.getElementById("teachersTable");

    if (!teachers.length) {

        table.innerHTML = `
            <tr>
                <td colspan="6">No teachers found.</td>
            </tr>
        `;

        return;
    }

    table.innerHTML =
        teachers.map(teacher => `

            <tr>

                <td data-label="ID">${esc(teacher.id)}</td>

                <td data-label="Name">${esc(teacher.name)}</td>

                <td data-label="Father">${esc(teacher.father)}</td>

                <td data-label="Subject">${esc(teacher.subject)}</td>

                <td data-label="Phone">${esc(teacher.phone)}</td>

                <td data-label="Actions">

                    <span>
                        <button
                            onclick="editTeacher(${Number(teacher.id)})"
                            class="btn-small"
                        >
                            ✏️
                        </button>

                        <button
                            onclick="deleteTeacher(${Number(teacher.id)})"
                            class="btn-small btn-danger"
                        >
                            🗑️
                        </button>
                    </span>

                </td>

            </tr>

        `).join("");
}


document
    .getElementById("teacherForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();

        const id =
            document.getElementById("teacherId").value;

        const teacher = {

            name:
                document.getElementById("name").value.trim(),

            father:
                document.getElementById("father").value.trim(),

            subject:
                document.getElementById("subject").value.trim(),

            phone:
                document.getElementById("phone").value.trim()

        };

        try {

            const url =
                id
                    ? `/api/teachers/${id}`
                    : "/api/teachers";

            const method =
                id ? "PUT" : "POST";

            const response =
                await fetch(url, {

                    method,

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify(teacher)

                });

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Unable to save teacher"
                );
            }

            document.getElementById("message").textContent =
                id
                    ? "Teacher updated successfully."
                    : "Teacher added successfully.";

            resetForm();

            loadTeachers();

        } catch (error) {

            document.getElementById("message").textContent =
                error.message;

        }

    });


function editTeacher(id) {

    const teacher =
        teachers.find(t => t.id == id);

    if (!teacher) return;

    document.getElementById("teacherId").value = teacher.id;

    document.getElementById("name").value = teacher.name || "";

    document.getElementById("father").value = teacher.father || "";

    document.getElementById("subject").value = teacher.subject || "";

    document.getElementById("phone").value = teacher.phone || "";

    document.getElementById("formTitle").textContent =
        "✏️ Edit Teacher";

    document.getElementById("cancelBtn").style.display =
        "inline-block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


async function deleteTeacher(id) {

    if (!confirm(
        "Are you sure you want to delete this teacher?"
    )) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/teachers/${id}`,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to delete teacher"
            );
        }

        loadTeachers();

    } catch (error) {

        alert(error.message);

    }
}


function resetForm() {

    document.getElementById("teacherForm").reset();

    document.getElementById("teacherId").value = "";

    document.getElementById("formTitle").textContent =
        "➕ Add Teacher";

    document.getElementById("cancelBtn").style.display =
        "none";
}


document
    .getElementById("cancelBtn")
    .addEventListener("click", resetForm);


loadTeachers();

</script>

<script src="/layout.js"></script>

</body>
</html>
