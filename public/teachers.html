<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - My School</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🎓 My School</h1>
    <p>Teacher Management</p>
</header>

<main>

    <h2>👨‍🏫 Add Teacher</h2>

    <form id="teacherForm">

        <input
            type="text"
            id="name"
            placeholder="Teacher Name"
            required
        >
<input
    type="text"
    id="father"
    placeholder="Father Name"
    required
>
        <input
            type="text"
            id="subject"
            placeholder="Subject"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >
        <button type="submit">

            Add Teacher
        </button>

    </form>

    <h2>Teacher List</h2>

    <div id="teacherList"></div>

    <br>

    <a href="/">⬅ Back to Dashboard</a>

</main>

<script>

const form =
    document.getElementById("teacherForm");

const teacherList =
    document.getElementById("teacherList");


async function loadTeachers() {

    const response =
        await fetch("/api/teachers");

    const teachers =
        await response.json();

    teacherList.innerHTML = "";

    teachers.forEach(teacher => {

        const div =
            document.createElement("div");

        div.className = "card";

        div.innerHTML = `
            <h3>👨‍🏫 ${teacher.name}</h3>
            <p>Subject: ${teacher.subject}</p>
            <p>Phone: ${teacher.phone}</p>

            <button onclick="deleteTeacher(${teacher.id})">
                🗑️ Delete
            </button>
        `;

        teacherList.appendChild(div);

    });
}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const teacher = {

    name:
        document.getElementById("name").value,

    father:
        document.getElementById("father").value,

    subject:
        document.getElementById("subject").value,

    phone:
        document.getElementById("phone").value

};
        const response =
            await fetch("/api/teachers", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(teacher)

            });

        if (response.ok) {

            alert(
                "Teacher saved successfully! ✅"
            );

            form.reset();

            loadTeachers();

        } else {

            alert(
                "Something went wrong ❌"
            );

        }

    }
);


async function deleteTeacher(id) {

    if (
        !confirm(
            "Are you sure you want to delete this teacher?"
        )
    ) {
        return;
    }

    await fetch(
        "/api/teachers/" + id,
        {
            method: "DELETE"
        }
    );

    alert("Teacher deleted! 🗑️");

    loadTeachers();
}


loadTeachers();

</script>

</body>
</html>
