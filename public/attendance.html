<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Attendance - School Management</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/layout.css">
</head>

<body>

<header class="dashboard-header">
    <div>
        <h1>🎓 <span id="schoolName">My School</span></h1>
        <p>Attendance Management</p>
    </div>
</header>

<nav class="main-nav">
    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/students.html">👨‍🎓 Students</a>
    <a href="/teachers.html">👨‍🏫 Teachers</a>
    <a href="/attendance.html" class="active">📅 Attendance</a>
    <a href="/attendance-report.html">📊 Reports</a>
    <a href="/classes.html">🏫 Classes</a>
    <a href="/fees.html">💰 Fees</a>
    <a href="/logout">🚪 Logout</a>
</nav>

<main>

    <div class="page-header">
        <div>
            <h2>📅 Attendance</h2>
            <p>Mark today's student attendance.</p>
        </div>
    </div>

    <section class="form-card">

        <div class="form-group">
            <label for="attendanceDate">Date</label>
            <input type="date" id="attendanceDate">
        </div>

    </section>

    <section class="table-card">

        <div class="table-header">
            <h3>👨‍🎓 Student Attendance</h3>
        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Class</th>
                        <th>Roll</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTable">
                    <tr>
                        <td colspan="5">Loading students...</td>
                    </tr>
                </tbody>

            </table>

        </div>

        <div style="margin-top:15px;">

            <button id="saveAttendance" class="btn-primary">
                💾 Save Attendance
            </button>

            <p id="message"></p>

        </div>

    </section>

</main>

<script>

let students = [];

const dateInput =
    document.getElementById("attendanceDate");

// Prevents student data from being interpreted as HTML
function esc(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function getToday() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(now.getDate())
            .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


dateInput.value = getToday();


async function loadStudents() {

    try {

        const response =
            await fetch("/api/students", {
                credentials: "include"
            });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return;
        }

        if (!response.ok) {
            throw new Error("Unable to load students");
        }

        students = await response.json();

        renderStudents();

    } catch (error) {

        console.error(error);

        document.getElementById("attendanceTable").innerHTML = `
            <tr>
                <td colspan="5">Unable to load students.</td>
            </tr>
        `;
    }
}


async function renderStudents() {

    const table =
        document.getElementById("attendanceTable");

    if (!students.length) {

        table.innerHTML = `
            <tr>
                <td colspan="5">No students found.</td>
            </tr>
        `;

        return;
    }

    table.innerHTML =
        students.map(student => `

            <tr>

                <td data-label="ID">${esc(student.id)}</td>

                <td data-label="Student">${esc(student.name)}</td>

                <td data-label="Class">${esc(student.classname)}</td>

                <td data-label="Roll">${esc(student.roll)}</td>

                <td data-label="Status">

                    <select
                        class="attendance-status"
                        data-student-id="${Number(student.id)}"
                    >
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="leave">Leave</option>
                    </select>

                </td>

            </tr>

        `).join("");

}


document
    .getElementById("saveAttendance")
    .addEventListener("click", saveAttendance);


async function saveAttendance() {

    const date =
        dateInput.value;

    if (!date) {

        alert("Please select a date.");

        return;
    }


    const statuses =
        document.querySelectorAll(".attendance-status");


    if (!statuses.length) {

        alert("No students available.");

        return;
    }


    const button =
        document.getElementById("saveAttendance");

    const message =
        document.getElementById("message");


    button.disabled = true;

    button.textContent = "Saving...";


    try {

        for (const select of statuses) {

            const studentId =
                select.dataset.studentId;

            const status =
                select.value;


            const response =
                await fetch("/api/attendance", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({

                        studentId: Number(studentId),

                        date,

                        status

                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Unable to save attendance"
                );
            }

        }


        message.textContent =
            "Attendance saved successfully.";

        message.style.color = "green";


    } catch (error) {

        console.error(error);

        message.textContent = error.message;

        message.style.color = "red";


    } finally {

        button.disabled = false;

        button.textContent = "💾 Save Attendance";

    }

}


loadStudents();

</script>

<script src="/layout.js"></script>

</body>
</html>
