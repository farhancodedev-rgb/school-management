<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Attendance - My School</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .attendance-tools {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .attendance-tools label {
            display: block;
            font-weight: bold;
            margin: 8px 0;
        }

        .attendance-tools input,
        .attendance-tools select {
            width: 100%;
            box-sizing: border-box;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            padding: 18px 10px;
            border-radius: 15px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .summary-card h3 {
            margin: 0;
            font-size: 14px;
        }

        .summary-card p {
            margin: 7px 0 0;
            font-size: 27px;
            font-weight: bold;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-buttons button {
            margin: 0;
        }

        .student-row {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .student-info h3 {
            margin: 0 0 7px;
        }

        .student-info p {
            margin: 4px 0;
            color: var(--muted);
        }

        .attendance-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .attendance-buttons button {
            margin: 0;
            border: 2px solid transparent;
        }

        .present-btn {
            background: #dcfce7;
            color: #166534;
        }

        .absent-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        .present-btn.active {
            border-color: #16a34a;
            box-shadow: 0 0 0 2px rgba(22,163,74,.12);
            font-weight: bold;
        }

        .absent-btn.active {
            border-color: #dc2626;
            box-shadow: 0 0 0 2px rgba(220,38,38,.12);
            font-weight: bold;
        }

        .save-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            font-size: 17px;
        }

        .empty-message {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: var(--muted);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
        }

        .status-present {
            background: #dcfce7;
            color: #166534;
        }

        .status-absent {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        @media (max-width: 700px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

        }

        @media (max-width: 400px) {

            .summary-card p {
                font-size: 23px;
            }

            .attendance-buttons {
                grid-template-columns: 1fr;
            }

            .quick-buttons {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="dashboard-header">

    <h1>🎓 My School</h1>

    <p>
        Student Attendance
    </p>

</header>


<nav class="main-nav">

    <a href="/dashboard.html">
        🏠 Dashboard
    </a>

    <a href="/students.html">
        👨‍🎓 Students
    </a>

    <a href="/teachers.html">
        👨‍🏫 Teachers
    </a>

    <a href="/attendance.html" class="active">
        📅 Attendance
    </a>

    <a href="/attendance-report.html">
        📊 Reports
    </a>

    <a href="/classes.html">
        🏫 Classes
    </a>
    <a href="/fees.html">
        💰 Fees
    </a>
    <a id="navLogout" href="/logout">🚪 Logout</a>

</nav>

<main>


    <div class="page-header">

        <div>

            <h2>
                📅 Mark Attendance
            </h2>

            <p style="color:var(--muted);">
                Select a date and mark student attendance
            </p>

        </div>

        <strong id="attendanceStatus">
            Not saved
        </strong>

    </div>


    <!-- FILTERS -->

    <div class="attendance-tools">

        <label for="attendanceDate">
            📅 Date
        </label>

        <input
            type="date"
            id="attendanceDate">


        <label for="searchStudent">
            🔍 Search Student
        </label>

        <input
            type="search"
            id="searchStudent"
            placeholder="Search by name, roll number...">


        <label for="classFilter">
            🏫 Class
        </label>

        <select id="classFilter">

            <option value="all">
                All Classes
            </option>

        </select>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <h3>
                👨‍🎓 Total
            </h3>

            <p id="totalCount">
                0
            </p>

        </div>


        <div class="summary-card">

            <h3>
                ✅ Present
            </h3>

            <p id="presentCount">
                0
            </p>

        </div>


        <div class="summary-card">

            <h3>
                ❌ Absent
            </h3>

            <p id="absentCount">
                0
            </p>

        </div>


        <div class="summary-card">

            <h3>
                ⏳ Pending
            </h3>

            <p id="pendingCount">
                0
            </p>

        </div>

    </div>


    <!-- QUICK ACTIONS -->

    <div class="quick-buttons">

        <button
            type="button"
            onclick="markAll('Present')">

            ✅ Mark All Present

        </button>


        <button
            type="button"
            onclick="markAll('Absent')">

            ❌ Mark All Absent

        </button>

    </div>


    <!-- STUDENTS -->

    <div id="attendanceList">

        <div class="empty-message">
            Loading students...
        </div>

    </div>


    <!-- SAVE -->

    <button
        class="save-btn"
        onclick="saveAttendance()">

        💾 Save Attendance

    </button>


    <br><br>


</main>


<script>

let students = [];

const attendance = {};

let isLoadingDate = false;


const attendanceDate =
    document.getElementById(
        "attendanceDate"
    );

const searchStudent =
    document.getElementById(
        "searchStudent"
    );

const classFilter =
    document.getElementById(
        "classFilter"
    );

const attendanceList =
    document.getElementById(
        "attendanceList"
    );


/* =========================
   TODAY
========================= */

const today =
    new Date()
        .toISOString()
        .split("T")[0];

attendanceDate.value = today;


/* =========================
   LOAD STUDENTS
========================= */

async function loadStudents() {

    try {

        const response =
            await fetch(
                "/api/students"
            );

        if (!response.ok) {
            throw new Error(
                "Students API failed"
            );
        }

        students =
            await response.json();


        createClassFilter();

        await loadSavedAttendance();

    }

    catch (error) {

        console.log(
            "Students error:",
            error
        );

        attendanceList.innerHTML = `
            <div class="empty-message">
                ❌ Unable to load students.
            </div>
        `;

    }

}


/* =========================
   CLASS FILTER
========================= */

function createClassFilter() {

    const classes = [
        ...new Set(
            students
                .map(
                    student =>
                        student.className
                )
                .filter(Boolean)
        )
    ];


    classFilter.innerHTML = `
        <option value="all">
            All Classes
        </option>
    `;


    classes.sort().forEach(
        className => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                className;

            option.textContent =
                className;

            classFilter.appendChild(
                option
            );

        }
    );

}


/* =========================
   LOAD SAVED ATTENDANCE
========================= */

async function loadSavedAttendance() {

    const date =
        attendanceDate.value;


    if (!date) return;


    isLoadingDate = true;


    try {

        const response =
            await fetch(
                "/api/attendance?date=" +
                encodeURIComponent(date)
            );


        if (!response.ok) {
            throw new Error(
                "Attendance API failed"
            );
        }


        const records =
            await response.json();


        /*
         * IMPORTANT:
         * New/unmarked students are Pending,
         * NOT Present.
         */

        students.forEach(
            student => {

                attendance[
                    student.id
                ] = "Pending";

            }
        );


        records.forEach(
            record => {

                attendance[
                    record.studentId
                ] =
                    record.status;

            }
        );


        renderStudents();


        updateSavedStatus(
            records.length > 0
        );

    }

    catch (error) {

        console.log(
            "Attendance load error:",
            error
        );


        students.forEach(
            student => {

                attendance[
                    student.id
                ] = "Pending";

            }
        );


        renderStudents();

    }


    isLoadingDate = false;

}


/* =========================
   RENDER STUDENTS
========================= */

function renderStudents() {

    const search =
        searchStudent.value
            .toLowerCase()
            .trim();


    const selectedClass =
        classFilter.value;


    const filtered =
        students.filter(
            student => {

                const name =
                    String(
                        student.name || ""
                    )
                    .toLowerCase();


                const roll =
                    String(
                        student.roll || ""
                    )
                    .toLowerCase();


                const matchesSearch =
                    name.includes(search) ||
                    roll.includes(search);


                const matchesClass =
                    selectedClass === "all" ||
                    student.className ===
                        selectedClass;


                return (
                    matchesSearch &&
                    matchesClass
                );

            }
        );


    attendanceList.innerHTML = "";


    if (!filtered.length) {

        attendanceList.innerHTML = `
            <div class="empty-message">
                🔍 No students found.
            </div>
        `;

        updateSummary();

        return;

    }


    filtered.forEach(
        student => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "student-row";


            const status =
                attendance[
                    student.id
                ] || "Pending";


            let badgeClass =
                "status-pending";


            if (
                status === "Present"
            ) {
                badgeClass =
                    "status-present";
            }


            if (
                status === "Absent"
            ) {
                badgeClass =
                    "status-absent";
            }


            div.innerHTML = `

                <div class="student-info">

                    <h3>
                        👨‍🎓
                        ${escapeHTML(
                            student.name
                        )}
                    </h3>

                    <p>
                        🏫 Class:
                        ${escapeHTML(
                            student.className
                        )}
                    </p>

                    <p>
                        🔢 Roll No:
                        ${escapeHTML(
                            student.roll
                        )}
                    </p>

                    <span
                        class="status-badge ${badgeClass}">

                        ${status}

                    </span>

                </div>


                <div class="attendance-buttons">

                    <button
                        type="button"
                        class="present-btn
                        ${status === "Present"
                            ? "active"
                            : ""}"

                        onclick="
                            setAttendance(
                                ${student.id},
                                'Present'
                            )
                        ">

                        ✅ Present

                    </button>


                    <button
                        type="button"
                        class="absent-btn
                        ${status === "Absent"
                            ? "active"
                            : ""}"

                        onclick="
                            setAttendance(
                                ${student.id},
                                'Absent'
                            )
                        ">

                        ❌ Absent

                    </button>

                </div>

            `;


            attendanceList.appendChild(
                div
            );

        }
    );


    updateSummary();

}


/* =========================
   SET ATTENDANCE
========================= */

function setAttendance(
    id,
    status
) {

    attendance[id] =
        status;


    updateSavedStatus(false);


    renderStudents();

}


/* =========================
   MARK ALL
========================= */

function markAll(status) {

    if (!students.length) {

        alert(
            "No students available."
        );

        return;

    }


    students.forEach(
        student => {

            attendance[
                student.id
            ] =
                status;

        }
    );


    updateSavedStatus(false);


    renderStudents();

}


/* =========================
   SUMMARY
========================= */

function updateSummary() {

    const total =
        students.length;


    let present = 0;
    let absent = 0;
    let pending = 0;


    students.forEach(
        student => {

            const status =
                attendance[
                    student.id
                ];


            if (
                status === "Present"
            ) {
                present++;
            }

            else if (
                status === "Absent"
            ) {
                absent++;
            }

            else {
                pending++;
            }

        }
    );


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "presentCount"
    ).textContent =
        present;


    document.getElementById(
        "absentCount"
    ).textContent =
        absent;


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;

}


/* =========================
   SAVE
========================= */

async function saveAttendance() {

    const date =
        attendanceDate.value;


    if (!date) {

        alert(
            "Please select a date."
        );

        return;

    }


    const pending =
        students.filter(
            student =>
                !attendance[
                    student.id
                ] ||
                attendance[
                    student.id
                ] === "Pending"
        );


    if (pending.length > 0) {

        const proceed =
            confirm(
                pending.length +
                " student(s) are not marked. Save anyway?"
            );


        if (!proceed) {
            return;
        }

    }


    try {

        let failed = 0;


        for (
            const student of students
        ) {

            const status =
                attendance[
                    student.id
                ];


            if (
                status === "Pending"
            ) {
                continue;
            }


            const response =
                await fetch(
                    "/api/attendance",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                studentId:
                                    student.id,

                                date:
                                    date,

                                status:
                                    status

                            })

                    }
                );


            if (!response.ok) {
                failed++;
            }

        }


        if (failed > 0) {

            alert(
                "Some attendance records could not be saved ❌"
            );

            return;

        }


        updateSavedStatus(true);


        alert(
            "Attendance saved successfully! ✅"
        );

    }

    catch (error) {

        console.log(
            "Save attendance error:",
            error
        );


        alert(
            "Could not save attendance ❌"
        );

    }

}


/* =========================
   DATE CHANGE
========================= */

attendanceDate.addEventListener(
    "change",
    async function() {

        await loadSavedAttendance();

    }
);


/* =========================
   SEARCH
========================= */

searchStudent.addEventListener(
    "input",
    renderStudents
);


/* =========================
   CLASS
========================= */

classFilter.addEventListener(
    "change",
    renderStudents
);


/* =========================
   SAVE STATUS
========================= */

function updateSavedStatus(
    saved
) {

    const element =
        document.getElementById(
            "attendanceStatus"
        );


    if (saved) {

        element.textContent =
            "✅ Saved";

    } else {

        element.textContent =
            "✏️ Unsaved changes";

    }

}


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   START
========================= */

loadStudents();

</script>

<script src="/script.js?v=3"></script>
</body>
</html>
