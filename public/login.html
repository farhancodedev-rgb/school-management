<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - My School</title>

    <link rel="stylesheet" href="style.css?v=2">
<style>
.login-page {
    min-height: 100vh;
    margin: 0;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.login-page::before,
.login-page::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .35;
    animation: floatCircle 6s ease-in-out infinite;
}

.login-page::before {
    width: 220px;
    height: 220px;
    background: #6366f1;
    top: -80px;
    left: -70px;
}

.login-page::after {
    width: 260px;
    height: 260px;
    background: #06b6d4;
    right: -100px;
    bottom: -100px;
    animation-delay: 2s;
}

.login-page header {
    background: transparent;
    text-align: center;
    box-shadow: none;
    padding: 0 20px 18px;
    position: relative;
    z-index: 2;
}

.login-page header h1 {
    margin: 0;
    font-size: 30px;
    color: white;
}

.login-page header p {
    margin-top: 6px;
    color: #cbd5e1;
}

.login-page main {
    width: 100%;
    max-width: 390px;
    padding: 15px;
    position: relative;
    z-index: 2;
}

.login-page form {
    margin: 0;
    padding: 30px;
    border-radius: 24px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.20);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
    animation: loginAppear .7s ease;
}

.login-page h2 {
    color: white;
    text-align: center;
    margin-top: 0;
    margin-bottom: 22px;
}

.login-page input {
    background: rgba(255,255,255,.10);
    color: white;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;
    padding: 13px;
    box-sizing: border-box;
}

.login-page input::placeholder {
    color: #cbd5e1;
}

.login-page input:focus {
    border-color: #818cf8;
    box-shadow: 0 0 0 3px rgba(129,140,248,.18);
    transform: none;
}

.login-page button {
    width: 100%;
    margin: 6px 0 0;
    border-radius: 12px;
    padding: 13px;
    background: linear-gradient(135deg,#6366f1,#06b6d4);
    border: none;
    box-shadow: 0 8px 20px rgba(6,182,212,.25);
    transition: .25s ease;
}

.login-page button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(6,182,212,.4);
}

.login-page button:active {
    transform: scale(.97);
}

@keyframes loginAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes floatCircle {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(25px); }
}

@media (max-width:600px) {
    .login-page header h1 {
        font-size: 26px;
    }

    .login-page main {
        padding: 12px;
    }

    .login-page form {
        padding: 24px;
    }
}
</style>
</head>

<body class="login-page">

<header>
    <h1>🎓 My School</h1>
    <p>Admin Login</p>
</header>

<main>

    <h2>🔐 Login</h2>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🔑 Login
        </button>

    </form>

</main>

<script>

const loginForm =
    document.getElementById("loginForm");

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document.getElementById(
                "username"
            ).value;

        const password =
            document.getElementById(
                "password"
            ).value;

        const response =
            await fetch("/api/login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            });

        const result =
            await response.json();

        if (result.success) {

            alert("Login successful! ✅");

            window.location.href = "/";

        } else {

            alert(
                "Wrong username or password ❌"
            );
        }
    }
);

</script>

</body>
</html>
