<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - My School</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🎓 My School</h1>
    <p>Admin Login</p>
</header>

<main>

    <h2>🔐 Login</h2>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🔑 Login
        </button>

    </form>

</main>

<script>

const loginForm =
    document.getElementById("loginForm");

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document.getElementById(
                "username"
            ).value;

        const password =
            document.getElementById(
                "password"
            ).value;

        const response =
            await fetch("/api/login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            });

        const result =
            await response.json();

        if (result.success) {

            alert("Login successful! ✅");

            window.location.href = "/";

        } else {

            alert(
                "Wrong username or password ❌"
            );
        }
    }
);

</script>

</body>
</html>
