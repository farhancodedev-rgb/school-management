<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login - School Management</title>
<link rel="stylesheet" href="/style.css">
<style>
/* Login page styles (self-contained; move into style.css later if you like) */
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7488;--pr:#4f46e5;--bd:#e3e7f0;--hd:rgba(255,255,255,.6);--ok:#1c9a58;--er:#d23c3c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--tx:#e8ebf5;--mu:#9099b3;--bd:#262b45;--hd:rgba(15,18,32,.6)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:clamp(14px,3.6vw,16px)/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
a{color:var(--pr);text-decoration:none}
.top{position:fixed;top:0;left:0;right:0;height:48px;padding:env(safe-area-inset-top,0px) clamp(10px,3vw,24px) 0;box-sizing:content-box;display:flex;align-items:center;gap:8px;background:var(--hd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);font-size:clamp(13px,3.4vw,15px);z-index:10}
.top b{font-weight:600}
.top .sp{flex:1}
.auth-container{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:clamp(20px,6vw,32px);box-shadow:0 8px 30px rgba(0,0,0,.06)}
.auth-logo{width:clamp(48px,14vw,60px);height:clamp(48px,14vw,60px);margin:0 auto 10px;border-radius:16px;background:rgba(79,70,229,.12);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,30px)}
.auth-card h1{text-align:center;font-size:clamp(20px,5.6vw,24px)}
.auth-subtitle{text-align:center;color:var(--mu);margin:2px 0 18px;font-size:.92em}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.88em;font-weight:500;margin-bottom:5px}
.form-group input{width:100%;padding:11px 12px;font-size:16px;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:10px;outline:none}
.form-group input:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(79,70,229,.18)}
.btn-primary{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:1em;font-weight:500;cursor:pointer}
.btn-primary:active{opacity:.85}
.form-message{min-height:1.4em;margin-top:12px;text-align:center;font-size:.9em;color:var(--mu)}
.form-message.success{color:var(--ok)}
.form-message.error{color:var(--er)}
.auth-footer{margin-top:16px;padding-top:14px;border-top:1px solid var(--bd);text-align:center;font-size:.9em;color:var(--mu)}
</style>
</head>

<body>

<header class="top">
    <a href="/">←</a>
    <b>🏫 School Management</b>
    <span class="sp"></span>
</header>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            🎓
        </div>

        <h1>School Management</h1>
        <p class="auth-subtitle">Login to your account</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn-primary">
                🔐 Login
            </button>

            <p id="loginMessage" class="form-message"></p>

        </form>

        <div class="auth-footer">
            <p>
                Don't have an account?
                <a href="/register.html">Create School Account</a>
            </p>
        </div>

    </div>

</div>

<script>
document
    .getElementById("loginForm")
    .addEventListener("submit", async function (e) {

        e.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("loginMessage");

        message.textContent = "Logging in...";
        message.className = "form-message";

        try {

            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    username,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                message.textContent =
                    data.error || "Invalid username or password.";

                message.className =
                    "form-message error";

                return;
            }

            message.textContent =
                "Login successful. Redirecting...";

            message.className =
                "form-message success";

            setTimeout(() => {
                window.location.href = "/dashboard.html";
            }, 500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server.";

            message.className =
                "form-message error";
        }

    });
</script>

</body>
</html>
